name: Deploy to jolaball.is

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jolaball-is
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Register SFTP host key
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$FTP_PORT" -H "$FTP_SERVER" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload site over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          sshpass -p "$FTP_PASSWORD" sftp \
            -P "$FTP_PORT" \
            "$FTP_USERNAME@$FTP_SERVER" <<'SFTP'
          put index.html /index.html
          put preview.html /preview.html
          put hero-jolaball.jpg /hero-jolaball.jpg
          SFTP
